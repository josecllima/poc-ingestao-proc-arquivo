# Configuração comum da API e dos workers: mesma imagem, mesmas variáveis
x-app: &app
  build: ./backend
  image: certacon-app
  env_file: .env
  environment:
    DB_HOST: sqlserver
    RABBIT_HOST: rabbitmq
  volumes: [storage:/storage]
  depends_on:
    db-init: { condition: service_completed_successfully }
    rabbitmq: { condition: service_healthy }

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports: ["14330:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver: { condition: service_healthy }
    volumes: [./db:/db:ro]
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${DB_PASSWORD}" -C -i /db/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 12

  backend:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: curl -fs http://localhost:8000/health || exit 1
      interval: 15s
      retries: 5
      start_period: 15s

  worker-ingestao:
    <<: *app
    command: python -m app.workers.main --fila lotes
    restart: unless-stopped

volumes:
  sqldata: {}
  rabbitdata: {}
  storage: {}
